<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Token Usage Per User</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(-45deg, #121212, #1e1e1e, #2a2a2a, #1a1a1a);
            background-size: 400% 400%;
            animation: gradientWave 15s ease infinite;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 40px;
            margin: 0;
            min-height: 100vh;
            position: relative;
            overflow-x: auto;
        }

        @keyframes gradientWave {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Floating orbs background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 80%, rgba(0, 150, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(100, 200, 255, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(0, 180, 220, 0.12) 0%, transparent 50%);
            animation: float 25s ease-in-out infinite;
            z-index: -1;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(30px, -30px) rotate(120deg); }
            66% { transform: translate(-20px, 20px) rotate(240deg); }
        }

        .section-title {
            font-size: clamp(24px, 4vw, 36px);
            margin-bottom: 32px;
            color: transparent;
            background: linear-gradient(45deg, #3b82f6, #06b6d4, #0ea5e9);
            background-size: 200% 200%;
            background-clip: text;
            -webkit-background-clip: text;
            text-align: center;
            font-weight: 600;
            animation: subtleGlow 6s ease-in-out infinite;
            letter-spacing: 0.5px;
        }

        @keyframes subtleGlow {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        table {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            border-collapse: collapse;
            background: rgba(40, 40, 40, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(59, 130, 246, 0.2);
            position: relative;
            animation: tableSubtleGlow 8s ease-in-out infinite;
        }

        @keyframes tableSubtleGlow {
            0%, 100% { 
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            }
            50% { 
                box-shadow: 0 4px 25px rgba(59, 130, 246, 0.2);
            }
        }

        thead {
            background: linear-gradient(135deg, rgba(55, 65, 81, 0.9), rgba(75, 85, 99, 0.9));
            position: relative;
        }

        thead::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            animation: sweep 3s infinite;
        }

        @keyframes sweep {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        th {
            color: #f0f0f0;
            padding: 16px 20px;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
        }

        th::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #3b82f6, #06b6d4);
            transition: all 0.4s ease;
            transform: translateX(-50%);
        }

        th:hover::before {
            width: 60%;
        }

        tbody tr {
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            position: relative;
        }

        tbody tr:nth-child(odd) {
            background: rgba(255, 255, 255, 0.02);
        }

        tbody tr:nth-child(even) {
            background: rgba(255, 255, 255, 0.05);
        }

        tbody tr:hover {
            background: linear-gradient(90deg, 
                rgba(59, 130, 246, 0.1), 
                rgba(6, 182, 212, 0.1)
            );
            transform: scale(1.01) translateX(3px);
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.2);
        }

        tbody tr::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 3px;
            background: linear-gradient(45deg, #3b82f6, #06b6d4);
            transform: scaleY(0);
            transition: transform 0.3s ease;
            transform-origin: bottom;
        }

        tbody tr:hover::before {
            transform: scaleY(1);
        }

        td {
            padding: 20px;
            font-size: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            transition: all 0.3s ease;
        }

        td:first-child {
            font-weight: 600;
            color: #4ecdc4;
            text-shadow: 0 0 10px rgba(78, 205, 196, 0.3);
        }

        td:last-child {
            font-weight: 700;
            color: #ff6b6b;
            text-shadow: 0 0 10px rgba(255, 107, 107, 0.3);
        }

        .back-link {
            display: inline-block;
            margin-top: 40px;
            padding: 18px 36px;
            background: linear-gradient(45deg, #667eea 0%, #764ba2 100%);
            color: #ffffff;
            text-decoration: none;
            font-size: 18px;
            font-weight: 600;
            border-radius: 50px;
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
            position: relative;
            overflow: hidden;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        .back-link::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.6s;
        }

        .back-link:hover::before {
            left: 100%;
        }

        .back-link:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.6);
            background: linear-gradient(45deg, #764ba2 0%, #667eea 100%);
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .section-title {
                font-size: 32px;
                margin-bottom: 30px;
            }
            
            th, td {
                padding: 15px 12px;
                font-size: 14px;
            }
            
            th {
                font-size: 16px;
            }
        }

        /* Subtle animation delays for rows */
        tbody tr:nth-child(1) { animation-delay: 0.1s; }
        tbody tr:nth-child(2) { animation-delay: 0.2s; }
        tbody tr:nth-child(3) { animation-delay: 0.3s; }
        tbody tr:nth-child(4) { animation-delay: 0.4s; }
        tbody tr:nth-child(5) { animation-delay: 0.5s; }

        /* Breathing effect for the whole table */
        @keyframes breathe {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.01); }
        }

        table {
            animation: tableGlow 8s ease-in-out infinite, breathe 4s ease-in-out infinite;
        }
    </style>
</head>
<body>
    <div class="section-title">📊 Token Usage Per User</div>

    <table>
        <thead>
            <tr>
                <th>User ID</th>
                <th>Tokens Used</th>
            </tr>
        </thead>
        <tbody>
            {% for user_id, count in token_usage_per_user.items() %}
                <tr>
                    <td>{{ user_id }}</td>
                    <td>{{ count }}</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>

    <a href="/INAI520/monitor" class="back-link">← Back to Dashboard</a>
</body>
</html>

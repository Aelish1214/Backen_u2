apiVersion: apps/v1
kind: Deployment
metadata:
  name: inai-api
  labels: { app: inai-api }
spec:
  replicas: 2
  selector: { matchLabels: { app: inai-api } }
  template:
    metadata: { labels: { app: inai-api } }
    spec:
      containers:
        - name: inai-api
          image: REPLACED-BY-CI   # workflow set karega
          ports: [ { containerPort: 8000 } ]
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: inai-secrets, key: DATABASE_URL } }
            - name: SOME_API_KEY
              valueFrom: { secretKeyRef: { name: inai-secrets, key: SOME_API_KEY } }
          readinessProbe: { httpGet: { path: /healthz, port: 8000 }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe:  { httpGet: { path: /healthz, port: 8000 }, initialDelaySeconds: 10, periodSeconds: 20 }
